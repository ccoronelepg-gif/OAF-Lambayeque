atos; 8E tártaro emético; 8F generadores de isotiocianato de metilo.","examples":"Bromuro de metilo (8A), cloropicrina (8B), ácido bórico (8D), dazomet (8F).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Múltiples blancos celulares, sin diana única","efectoFisiologico":"Inhibición o daño fisiológico multisitio, según sustancia.","recomendacionMIP":"No equiparar fumigantes u otros productos a uso libre; alta atención a registro, seguridad y etiqueta.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"9","name":"Moduladores de canales TRPV de órganos cordotonales","system":"Sistema sensorial / cordotonal","mechanism":"Alteran funciones sensoriales y de coordinación relacionadas con órganos cordotonales.","classes":"9B derivados de piridina azometina; 9D piropenas.","examples":"Pimetrozina (9B), pyrifluquinazon (9B), afidopyropen (9D).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Canales TRPV asociados a órganos cordotonales","efectoFisiologico":"Interrupción de percepción mecánica, coordinación y alimentación en especies susceptibles.","recomendacionMIP":"Monitorear alimentación y población; no inferir acción letal inmediata.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"10","name":"Inhibidores del crecimiento de ácaros que afectan CHS1","system":"Tegumento / quitina","mechanism":"Alteran la formación de quitina y el desarrollo de determinados ácaros.","classes":"10A clofentezina, diflovidazina y hexythiazox; 10B etoxazole.","examples":"Clofentezina, hexythiazox, etoxazole.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Síntesis de quitina CHS1 en ácaros en desarrollo","efectoFisiologico":"Alteraciones de la cutícula y la viabilidad de huevos o estadios inmaduros.","recomendacionMIP":"Efecto dependiente del estadio; monitorear estadios móviles y huevos.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"11","name":"Disruptores microbianos de las membranas del intestino medio de insectos","system":"Intestino medio / microbiano","mechanism":"Agentes microbianos o sus toxinas alteran las membranas intestinales de insectos susceptibles.","classes":"11A Bacillus thuringiensis y sus proteínas insecticidas; 11B Bacillus sphaericus.","examples":"B. thuringiensis var. kurstaki, aizawai o israelensis, según el blanco; B. sphaericus.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Epitelio del intestino medio de insectos susceptibles","efectoFisiologico":"Toxinas microbianas alteran membranas intestinales y disminuyen la alimentación.","recomendacionMIP":"La eficacia depende de especie, proteína Bt/cepa y exposición por ingestión.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"12","name":"Inhibidores de la ATP sintasa mitocondrial","system":"Respiración mitocondrial","mechanism":"Interfieren con la producción de ATP en las mitocondrias.","classes":"12A diafentiurón; 12B acaricidas organoestánnicos; 12C propargita; 12D tetradifón.","examples":"Diafentiurón (12A), cyhexatin (12B), propargita (12C), tetradifón (12D).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"ATP sintasa mitocondrial","efectoFisiologico":"Reducción de síntesis de ATP y del metabolismo energético.","recomendacionMIP":"Evitar exposición reiterada a la misma diana; revisar etiqueta por especie y cultivo.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"13","name":"Desacopladores de la fosforilación oxidativa por alteración del gradiente de protones","system":"Respiración mitocondrial","mechanism":"Desacoplan procesos mitocondriales y afectan la producción de energía.","classes":"Pirroles, dinitrofenoles y sulfluramid.","examples":"Clorfenapir, DNOC, sulfluramid.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Gradiente de protones mitocondrial","efectoFisiologico":"Desacople de fosforilación oxidativa; menor producción aprovechable de ATP.","recomendacionMIP":"No confundir con inhibidores de complejos específicos de la cadena respiratoria.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"14","name":"Bloqueadores de los canales del receptor nicotínico de acetilcolina (nAChR)","system":"Sistema nervioso / sinapsis","mechanism":"Bloquean canales del receptor nicotínico y alteran la transmisión nerviosa.","classes":"Análogos de nereistoxina.","examples":"Cartap, bensultap, tiociclam.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Canal iónico del receptor nicotínico nAChR","efectoFisiologico":"Bloqueo de neurotransmisión, con trastornos motores y parálisis.","recomendacionMIP":"Diferente modo de unión al de los grupos 4 y 5; no garantiza ausencia de resistencia cruzada.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"15","name":"Inhibidores de la biosíntesis de quitina que afectan CHS1","system":"Tegumento / quitina","mechanism":"Interfieren con la formación de quitina y pueden impedir una muda normal.","classes":"Benzoilureas.","examples":"Diflubenzurón, lufenuron, novaluron, triflumuron.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Síntesis de quitina; enzima CHS1","efectoFisiologico":"Cutícula defectuosa; fallos de muda y desarrollo en insectos inmaduros.","recomendacionMIP":"Priorizar identificación del estadio objetivo; evitar evaluar solo mortalidad inmediata.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"16","name":"Inhibidores de la biosíntesis de quitina, tipo 1","system":"Tegumento / quitina","mechanism":"Interfieren con la formación de la cutícula en estadios susceptibles.","classes":"Grupo representado por buprofezin.","examples":"Buprofezina.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Biosíntesis de quitina (diana proteica exacta no caracterizada)","efectoFisiologico":"Anomalías de cutícula y muda, principalmente en estadios inmaduros susceptibles.","recomendacionMIP":"No afirmar que posee exactamente el mismo sitio molecular del grupo 15.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"17","name":"Disruptores de la muda de dípteros","system":"Muda / desarrollo","mechanism":"Alteran la muda y el desarrollo de determinadas larvas de dípteros.","classes":"Grupo representado por cyromazine.","examples":"Ciromazina.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Proceso de muda de larvas de dípteros; diana exacta no definida","efectoFisiologico":"Alteración de la transición larvaria y de la formación cuticular.","recomendacionMIP":"Grupo dirigido a ciertos dípteros; no extrapolar a todos los insectos o cultivos.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"18","name":"Agonistas del receptor de ecdisona","system":"Regulación hormonal / metamorfosis","mechanism":"Activan señales relacionadas con la hormona de la muda y pueden inducir una muda prematura o anormal.","classes":"Diacilhidrazinas.","examples":"Metoxifenozida, tebufenozide, chromafenozide.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Receptor de ecdisona (EcR)","efectoFisiologico":"Señal hormonal de muda anormal; interrupción de alimentación y desarrollo larvario.","recomendacionMIP":"Dependiente de especie y estadio; revisar sensibilidad y registro.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"19","name":"Agonistas de los receptores de octopamina","system":"Sistema nervioso / sinapsis","mechanism":"Alteran la señalización neuromoduladora del sistema nervioso de los artrópodos.","classes":"Grupo representado por amitraz.","examples":"Amitraz.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Receptores de octopamina","efectoFisiologico":"Alteración neuromoduladora y del comportamiento motriz.","recomendacionMIP":"Evaluar organismos no objetivo y evitar tratamientos innecesarios.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"20","name":"Inhibidores del transporte de electrones mitocondrial, complejo III — sitio Qo","system":"Respiración mitocondrial","mechanism":"Interfieren con la respiración mitocondrial en el complejo III.","classes":"20A hydramethylnon; 20B acequinocyl; 20C fluacripirim; 20D bifenazato.","examples":"Hidrametilnona, acequinocyl, fluacripirim, bifenazato.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Complejo III mitocondrial; sitio Qo","efectoFisiologico":"Inhibición del transporte de electrones y de producción de energía.","recomendacionMIP":"Grupo diferente de otros complejos mitocondriales; verificar restricciones y eficacia.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"21","name":"Inhibidores del transporte de electrones mitocondrial, complejo I","system":"Respiración mitocondrial","mechanism":"Bloquean el transporte de electrones en el complejo I mitocondrial.","classes":"21A acaricidas e insecticidas METI; 21B rotenona.","examples":"Fenazaquina, fenpyroximate, pyridaben (21A); rotenona (21B).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Complejo I mitocondrial (NADH-ubiquinona oxidoreductasa)","efectoFisiologico":"Interrupción de transporte de electrones y de suministro de energía.","recomendacionMIP":"Rotar por grupo y monitorear resistencia en ácaros si corresponde.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"22","name":"Bloqueadores de los canales de sodio dependientes de voltaje","system":"Sistema nervioso / sinapsis","mechanism":"Bloquean canales de sodio y alteran la actividad nerviosa.","classes":"22A oxadiazinas; 22B semicarbazonas.","examples":"Indoxacarb (22A), metaflumizone (22B).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Canales de sodio dependientes de voltaje","efectoFisiologico":"Bloqueo de impulsos nerviosos; cese de alimentación y parálisis.","recomendacionMIP":"Aunque el grupo 3 también afecta sodio, ambos tienen distinta interacción molecular.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"23","name":"Inhibidores de la acetil-CoA carboxilasa","system":"Metabolismo lipídico / desarrollo","mechanism":"Interfieren con la biosíntesis de ácidos grasos y lípidos, afectando crecimiento y reproducción.","classes":"Derivados de ácidos tetrónicos y tetrámicos.","examples":"Spirotetramat, spiromesifen, spirodiclofen, spiropidion, spidoxamat.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Acetil-CoA carboxilasa (ACC), biosíntesis de lípidos","efectoFisiologico":"Menor síntesis de ácidos grasos; inhibición de crecimiento y fecundidad de estados susceptibles.","recomendacionMIP":"Respuesta más lenta y dependiente del estadio; no confundir con reguladores de quitina.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"24","name":"Inhibidores del transporte de electrones mitocondrial, complejo IV","system":"Respiración mitocondrial","mechanism":"Interfieren con el complejo IV de la respiración mitocondrial.","classes":"24A fosfuros; 24B cianuros.","examples":"Fosfuro de aluminio (24A), fosfina (24A), cianuro de sodio (24B).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Complejo IV mitocondrial","efectoFisiologico":"Interrupción de respiración celular y de generación de energía.","recomendacionMIP":"Compuestos de muy alto riesgo toxicológico: uso estrictamente regulado o prohibido según etiqueta.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"25","name":"Inhibidores del transporte de electrones mitocondrial, complejo II","system":"Respiración mitocondrial","mechanism":"Interfieren con el complejo II de la respiración mitocondrial.","classes":"25A derivados beta-cetonitrilo; 25B carboxanilidas.","examples":"Cyenopyrafen, cyflumetofen (25A), pyflubumide (25B).","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Complejo II mitocondrial (succinato deshidrogenasa)","efectoFisiologico":"Menor transporte de electrones y generación de energía celular.","recomendacionMIP":"No equiparar por nombre al FRAC 7: clasificación y organismos de destino son distintos.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"28","name":"Moduladores de los receptores de rianodina","system":"Sistema muscular / calcio","mechanism":"Alteran la liberación de calcio en las células musculares y provocan contracción descontrolada o parálisis.","classes":"Diamidas.","examples":"Clorantraniliprol, cyantraniliprole, flubendiamide, tetraniliprole.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Receptores de rianodina (RyR) en músculo","efectoFisiologico":"Liberación alterada de calcio intracelular; contracción descontrolada, parálisis y cese de alimentación.","recomendacionMIP":"Alternar diamidas del grupo 28 con modos independientes en ventanas MIP.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"29","name":"Inhibidores de la nicotinamidasa de órganos cordotonales","system":"Sistema sensorial / cordotonal","mechanism":"Alteran la función de órganos sensoriales cordotonales; el descriptor del grupo se basa en la clasificación IRAC.","classes":"Grupo representado por flonicamid.","examples":"Flonicamida.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Sistema de órganos cordotonales; nicotinamidasa","efectoFisiologico":"Disminución de la alimentación y alteraciones sensoriales en insectos susceptibles.","recomendacionMIP":"La reducción de alimentación puede preceder a la mortalidad.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"30","name":"Moduladores alostéricos de canales de cloruro regulados por GABA","system":"Sistema nervioso / sinapsis","mechanism":"Modulan canales de cloruro y alteran la función nerviosa.","classes":"Meta-diamidas e isoxazolinas.","examples":"Broflanilida, fluxametamida, isocycloseram.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Canales de cloruro dependientes de GABA; sitio alostérico","efectoFisiologico":"Desregulación inhibitoria del sistema nervioso y parálisis.","recomendacionMIP":"Grupo propio; verificar espectro y gestión de resistencia.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"31","name":"Baculovirus","system":"Biocontrol viral","mechanism":"Virus específicos de insectos que infectan y pueden matar a sus hospederos susceptibles.","classes":"Granulovirus (GV) y nucleopoliedrovirus (NPV).","examples":"Cydia pomonella GV; Helicoverpa armigera NPV; Anticarsia gemmatalis MNPV.","source":"https://irac-online.org/documents/moa-classification/","dianaEspecifica":"Infección viral específica de células del hospedero","efectoFisiologico":"Replicación del baculovirus con enfermedad y mortalidad en especies sensibles.","recomendacionMIP":"La especificidad depende del virus y su hospedero; no confundir con insecticida químico.","clasificacionFuente":"https://irac-online.org/documents/moa-classification/","alcance":"Modo de acción general por grupo; no valida cultivo, especie, formulación ni registro."},{"code":"32","name":"Moduladores a function renderAudit(){const docs=db.records.filter(r=>r.scope==='Perú').length;
$('view').innerHTML=`<div class="page-head"><div><div class="eyebrow">Control de calidad y trazabilidad</div><h1 class="page-title">✓ Seguimiento documental SENASA</h1><p class="page-lead">Revisa fuentes, registra observaciones y exporta tu lista de comprobación para los siete cultivos. Este módulo NO certifica registros vigentes.</p></div></div>
<div class="audit-intro"><strong>Verificación obligatoria antes de recomendar:</strong> consulta en <a href="${esc(api)}" target="_blank" rel="noopener noreferrer">SIGIA SENASA</a> la marca, ingrediente, cultivo, plaga o enfermedad y etiqueta vigente. Una ficha peruana, un ensayo científico o el estado «Fuente revisada» no constituye una autorización. Las anotaciones solo se guardan en este navegador. <a href="https://www.gob.pe/institucion/senasa/campa%C3%B1as/118609-normativa-registros-y-fiscalizacion-posregistro-de-plaguicidas-agricolas" target="_blank" rel="noopener noreferrer">Normativa y prohibiciones ↗</a></div>
<div class="audit-stats"><div class="metric"><strong id="auditPending">0</strong><small>Pendientes de revisar</small></div><div class="metric"><strong id="auditReviewed">0</strong><small>Fuentes revisadas por usuario</small></div><div class="metric"><strong id="auditOther">0</strong><small>Observadas o descartadas</small></div></div>
<div class="audit-toolbar"><input id="auditQuery" type="search" placeholder="Filtrar por marca, ingrediente, cultivo, plaga…" value="${esc(auditText)}" aria-label="Buscar en auditoría"><select id="auditFilter"><option>Todos</option><option>Pendiente</option><option>Fuente revisada</option><option>Requiere actualización</option><option>Referencia descartada</option></select><select id="auditKind"><option>Todos</option><option>IRAC</option><option>FRAC</option></select><button class="primary" id="auditCSV">↓ Exportar CSV</button></div>
<p class="verified-note"><span id="auditCount"></span> · ${docs} registros atribuidos a fuentes peruanas. <strong>0 confirmaciones individuales de vigencia obtenidas mediante SIGIA</strong>. El estado de seguimiento del usuario es independiente de esta auditoría documental.</p><div class="audit-brief"><b>Auditoría documental 28/10/2026:</b> ${db.records.filter(r=>r.auditoriaDocumental?.documentoEspecifico).length} fichas cultivo–blanco cotejadas con fabricante; se mantienen todas pendientes de vigencia individual. <b>Restricción:</b> clorpirifos prohibido para uso agrícola desde 01/08/2024.</div><div id="auditResults" class="audit-list"></div>`;
$('auditFilter').value=auditFilter;$('auditKind').value=auditKind;
$('auditQuery').oninput=e=>{auditText=e.target.value;auditLimit=24;auditList()};$('auditFilter').onchange=e=>{auditFilter=e.target.value;auditLimit=24;auditList()};$('auditKind').onchange=e=>{auditKind=e.target.value;auditLimit=24;auditList()};$('auditCSV').onclick=auditExport;updateAuditStats();auditList();}


function renderRadar(){
 const entries=db.socialMediaEvidence||[],leads=db.productLeads||[];
 $('view').innerHTML=`<div class="page-head"><div><div class="eyebrow">Investigación documental de proveedores</div><h1 class="page-title">☷ Radar de fuentes, redes y nuevas moléculas</h1><p class="page-lead">Seguimiento de Instagram, Facebook, YouTube, TikTok y páginas de proveedores. Ninguna publicación en redes es autorización fitosanitaria ni prueba de eficacia.</p></div></div>
 <div class="audit-intro"><strong>Jerarquía de evidencia:</strong> 1) resultado vigente de SIGIA SENASA + etiqueta actual; 2) etiqueta/ficha peruana del fabricante; 3) publicación científica; 4) video, fotografía o anuncio en redes. Los enlaces a redes se usan para localizar etiquetas oficiales. No se han añadido usos nuevos sin cultivo y blanco comprobados.</div>
 <div class="radar-grid">${entries.map(x=>`<article class="audit-card"><div class="audit-subline"><span class="audit-badge">${esc(x.plataforma)}</span><span class="audit-status">${esc(x.estatus)}</span></div><h3>${esc(x.proveedor)}</h3><p>${esc(x.hallazgo)}</p><p><b>Valor:</b> ${esc(x.valor)}</p><div class="audit-actions">${x.canal?srcLink(x.canal,'Canal / web ↗'):''}${x.fuente?srcLink(x.fuente,'Origen verificable ↗'):''}</div></article>`).join('')}</div>
 <h2 class="page-title" style="font-size:21px;margin-top:28px">Moléculas comerciales detectadas para evaluación</h2><p class="page-lead">Candidatos encontrados en portafolios comerciales: todavía NO se asignan a cultivo o plaga, ni se suman al catálogo.</p><div class="radar-grid">${leads.map(x=>`<article class="audit-card"><span class="audit-badge">${esc(x.grupo)}</span><h3>${esc(x.marca)}</h3><p><b>Ingrediente:</b> ${esc(x.ingredientes)}</p><p><b>Registro declarado:</b> ${esc(x.nRegistroPublicado)}</p><p>${esc(x.estatus)}</p>${srcLink(x.fuente,'Consultar empresa ↗')}</article>`).join('')}</div>
 <p class="verified-note section-margin">TikTok y publicaciones individuales de otras redes pueden estar bloqueados o no ser indexables. No se ha inventado contenido no accesible. Toda nueva marca debe ingresar con documento, ingrediente activo, cultivo, plaga y validación regulatoria.</p>`;
}


let regQ='',regType='Todos';
function renderRegulations(){
 const entries=db.regulatoryNews||[];
 $('view').innerHTML=`<div class="page-head"><div><div class="eyebrow">Normativa peruana · corte ${esc(db.regulatoryRevision?.fecha||'28/10/2026')}</div><h1 class="page-title">⚖ Regulaciones y alertas fitosanitarias</h1><p class="page-lead">Noticias resumidas de TC, SENASA, MIDAGRI y Defensoría con fechas, ingredientes, alcance y fuentes originales. No es un servicio de actualización automática.</p></div></div>
 <div class="reg-top"><div class="reg-highlight"><b>Sentencia 1111/2026 y RD D000015-2026</b><p>Suspensión temporal de venta, distribución y uso de cinco ingredientes <strong>cuando los productos se destinen a alimentos vegetales para consumo interno</strong>. La RD aclara que no cancela automáticamente los registros. <strong>Clorpirifos</strong> ya tenía prohibición de uso agrícola general desde agosto de 2024.</p><p>Para exportación: no interpretar la sentencia como habilitación automática; verificar etiqueta y registro SENASA, trazabilidad y restricciones del mercado de destino.</p></div><div class="reg-side"><strong>${entries.length} publicaciones</strong><small>Fuentes primarias, notas institucionales y actos normativos</small><strong>${db.records.filter(r=>r.alertaNormativa).length} fichas</strong><small>Coinciden con ingredientes sujetos a alertas de alcance específico</small></div></div>
 <div class="reg-toolbar"><label>Buscar noticia o molécula<input id="regSearch" type="search" value="${esc(regQ)}" placeholder="Ej. imidacloprid, TC, clorpirifos…"></label><label>Tipo<select id="regType"><option value="Todos">Todos</option>${[...new Set(entries.map(r=>r.tipo))].map(x=>`<option value="${esc(x)}" ${regType===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label><button class="primary" id="regExport">↓ Noticias CSV</button></div>
 <div class="reg-info">Los grupos IRAC y FRAC explican mecanismos de acción; <b>no autorizan productos</b>. El glifosato y el paraquat son herbicidas, fuera de IRAC/FRAC. La ausencia de alertas para un producto no significa registro vigente ni ausencia de restricciones.</div>
 <div id="regResults" class="reg-grid"></div><p class="verified-note section-margin">Actualización manual: contrastar siempre el Portal de Normativa de SENASA y las resoluciones más recientes. Los vínculos requieren conexión.</p>`;
 $('regSearch').oninput=e=>{regQ=e.target.value;drawReg()};$('regType').onchange=e=>{regType=e.target.value;drawReg()};$('regExport').onclick=()=>saveCSV(entries.map(x=>({fecha:x.fecha,tipo:x.tipo,autoridad:x.autoridad,titulo:x.titulo,numero:x.numero,ingredientes:x.ingredientes.join(' | '),alcance:x.alcance,resumen:x.resumen,implicancia:x.implicancia,estado:x.estado,fuentes:x.fuentes.join(' | ')})),['fecha','tipo','autoridad','titulo','numero','ingredientes','alcance','resumen','implicancia','estado','fuentes'],'AgroSanidad_Regulaciones_2026');
 drawReg();
}
function drawReg(){const rows=(db.regulatoryNews||[]).filter(x=>(regType==='Todos'||x.tipo===regType)&&(!regQ||clean([x.titulo,x.tipo,x.autoridad,x.numero,x.resumen,x.alcance,x.ingredientes.join(' ')].join(' ')).includes(clean(regQ)))).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 $('regResults').innerHTML=rows.length?rows.map(x=>`<article class="reg-card"><div class="reg-meta"><span>${esc(x.fecha)}</span><span class="reg-category ${x.tipo.includes('Prohibición')?'reg-danger':''}">${esc(x.tipo)}</span></div><h3>${esc(x.titulo)}</h3><p class="reg-author">${esc(x.autoridad)} · ${esc(x.numero)}</p><p>${esc(x.resumen)}</p>${x.ingredientes.length?`<div class="reg-molecules">${x.ingredientes.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`:''}<p><b>Alcance:</b> ${esc(x.alcance)}</p><p><b>Importancia para sanidad agrícola:</b> ${esc(x.implicancia)}</p><p class="reg-status">${esc(x.estado)}</p><div class="reg-links">${x.fuentes.map((u,i)=>srcLink(u,i===0?'Documento oficial ↗':'Otra fuente oficial ↗')).join(' · ')}</div></article>`).join(''):'<div class="empty">No hay noticias que coincidan. Prueba con otra molécula.</div>';
}

function renderFooter(){const links=db.sources.filter(x=>x&&x.url).slice(0,6);$('footLinks').innerHTML=links.map(x=>srcLink(x.url,x.name)).join(' · ')}
function render(){renderNav();const v=$('view');switch(state.page){case 'home':renderHome();break;case 'catalog':renderCatalog();break;case 'research':renderResearch();break;case 'dictionary':renderDictionary();break;case 'compare':renderCompare();break;case 'export':renderExport();break;case 'nonfungal':renderNonFungal();break;case 'visual':renderVisual();break;case 'audit':renderAudit();break;case 'radar':renderRadar();break;case 'regulations':renderRegulations();break;default:renderHome()}renderFooter()}
render();
</script></body></html>
