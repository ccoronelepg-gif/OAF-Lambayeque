name: OAF — Validación exploratoria de lluvia 1998
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validacion_3n.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oaf-validacion-3n
  cancel-in-progress: false

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install --quiet pandas numpy requests
      - name: Ejecutar contraste PISCOp ERA5 contra SENAMHI
        run: python scripts/validacion_3n_1998.py
      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VALIDACION_3N.md datos/comparacion_3n_1998.csv datos/metricas_3n_1998.csv datos/estado_3n_1998.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar resultados de comparacion exploratoria SENAMHI-PISCOp-ERA5 1998"
            git push
          fi
