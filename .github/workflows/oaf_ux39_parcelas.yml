name: OAF UX51 - Análisis zonal y pronóstico por coordenadas
on:
  push:
    paths:
      - "assets/oaf-parcelas-ux39.js"
      - "assets/oaf-parcelas-ux39.css"
      - "assets/oaf-visores-ux40.css"
      - "assets/oaf-territorio-compartido.js"
      - "assets/oaf-ux14-reorganizacion.js"
      - "assets/oaf-ux15-rf-salidas.js"
      - "assets/oaf-ux42-portada-carrusel.js"
      - "assets/oaf-ux42-interfaz.css"
      - "assets/oaf-area-ux38.js"
      - "index.html"
      - "sw.js"
      - "tests/test_ux39_parcelas.cjs"
      - "tests/test_ux41_semana.cjs"
      - "tests/test_ux43_weekbars.cjs"
      - "tests/test_ux44_estacional.cjs"
      - "modelos/pronostico_rf_experimental_ux15.py"
      - "datos/estado_enso_verificado_ux9_2026.json"
      - "tests/test_ux39_browser.cjs"
      - "tests/auditoria_ux39_servicios.cjs"
      - ".github/workflows/oaf_ux39_parcelas.yml"
  workflow_dispatch:
  schedule:
    - cron: "18 12 * * *"
permissions:
  contents: read
jobs:
  spatial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verificar GeoJSON, superficies, sector climatico y app movil
        run: |
          node tests/test_ux39_parcelas.cjs
          node tests/test_ux41_semana.cjs
          node tests/test_ux43_weekbars.cjs
          node tests/test_ux44_estacional.cjs
      - name: Auditar servicios ráster/vectoriales, ERA5-Land y Open-Meteo
        run: node tests/auditoria_ux39_servicios.cjs
      - name: Conservar evidencia fechada de cada auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux51-geoservicios
          path: ux51-auditoria-geoservicios.json
          if-no-files-found: warn
  browser-smoke:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar Chromium para el visor GIS
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir version web/PWA en localhost
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ux39-server.log 2>&1 &
          sleep 2
      - name: Verificar parcelario, puntos UTM y visores SVG en navegador
        run: node tests/test_ux39_browser.cjs
