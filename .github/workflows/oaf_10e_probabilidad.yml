name: OAF 10E · Probabilidades climáticas de autor
on:
  push:
    paths:
      - "modelos/probabilidad_multivariable_10e.py"
      - "tests/test_probabilidad_10e.py"
      - ".github/workflows/oaf_10e_probabilidad.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas estadísticas congeladas
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 scikit-learn==1.9.1
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validar disponibilidad de variables y ausencia de fugas
        run: python -m unittest discover -s tests -p test_probabilidad_10e.py -v
      - name: Entrenar Random Forest y GCN con y sin factores oceano-atmosfericos
        run: python modelos/probabilidad_multivariable_10e.py
      - name: Verificar integridad de resultados y bloqueo operativo
        run: python modelos/probabilidad_multivariable_10e.py --check
      - name: Exigir cobertura y límites
        run: |
          python - <<'PY'
          import json
          d=json.load(open('datos/probabilidades_10e/evaluacion_probabilistica_10e.json',encoding='utf8'))
          assert len(d['localidades'])==4
          assert d['n_muestras_por_modelo']=={'entrenamiento':912,'ajuste':144,'calibracion':96,'prueba':240}
          assert len(d['resultados'])==5
          assert d['modelo_operativo_certificado'] is None
          assert not d['alertas_habilitadas']
          assert not d['as_issued_disponible']
          assert not d['transferencia_espacial_validada']
          for m,report in d['resultados'].items():
            print("10E_MODELO",m,report['global'],report['por_anio']['2023'])
          print("10E_SELECCION",d['modelo_destacado_experimental_si_supera_climatologia'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oaf10e-comparacion-probabilistica
          path: datos/probabilidades_10e/*
          retention-days: 90
      - name: Publicar JSON y predicciones experimentales auditadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/probabilidades_10e/evaluacion_probabilistica_10e.json datos/probabilidades_10e/predicciones_probabilisticas_10e.csv
          git diff --cached --quiet || git commit -m "data(10E): benchmark RF-GCN probabilístico con fuentes verificadas"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
