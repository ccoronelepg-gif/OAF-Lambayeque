name: OAF App - Generar iconos PWA
on:
  push:
    branches: [main]
    paths:
      - "scripts/generar_iconos_pwa_ux20.py"
      - "assets/oaf-app-icon.svg"
      - "assets/oaf-app-maskable.svg"
      - ".github/workflows/oaf_app_iconos_ux20.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oaf-iconos-pwa
  cancel-in-progress: false
jobs:
  generar_iconos_instalables:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias de creación y verificación PNG
        run: python -m pip install cairosvg pillow
      - name: Crear PNG 192, 512, maskable 512 y Apple 180
        run: python scripts/generar_iconos_pwa_ux20.py
      - name: Confirmar dimensiones y contenido binario
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          for name,size in [('oaf-app-icon-192.png',192),('oaf-app-icon-512.png',512),('oaf-app-maskable-512.png',512),('oaf-apple-touch-icon-180.png',180)]:
              f=Path('assets')/name
              assert f.exists() and f.read_bytes().startswith(b'\x89PNG\r\n\x1a\n')
              with Image.open(f) as im:
                  assert im.size==(size,size), (name, im.size)
          PY
      - name: Guardar íconos binarios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/oaf-app-icon-192.png assets/oaf-app-icon-512.png assets/oaf-app-maskable-512.png assets/oaf-apple-touch-icon-180.png
          if git diff --cached --quiet; then
            echo "Los cuatro íconos están actualizados."
          else
            git commit -m "assets(pwa): generar iconos de aplicación 192/512 y iOS"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
