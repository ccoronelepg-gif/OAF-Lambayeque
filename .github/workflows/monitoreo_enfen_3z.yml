name: OAF 3Z ultimo comunicado oficial ENFEN
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitoreo_enfen_3z.yml'
      - 'scripts/monitoreo_enfen_3z.py'
  schedule:
    - cron: '45 15 * * 1'
permissions:
  contents: write
concurrency:
  group: oaf-3z-enfen
  cancel-in-progress: false
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector de pagina institucional
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verificar comunicado ENFEN y su fecha
        id: analizar
        shell: bash
        run: |
          set +e
          python -u scripts/monitoreo_enfen_3z.py
          echo "salida=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Guardar estado oficial documentado incluso ante fallo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datos/estado_enfen_3z.json MONITOREO_ENFEN_3Z.md
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar referencia oficial ENFEN con fecha y trazabilidad 3Z"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Avisar si la lectura oficial no fue verificable
        shell: bash
        run: |
          test "${{ steps.analizar.outputs.salida }}" = "0" || (echo "La lectura del estado ENFEN requiere revision; no se muestra como vigente" && exit 1)
