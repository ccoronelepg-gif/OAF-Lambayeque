name: OAF 8Y - Diagnostico PM y meteo sin causalidad
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modelos/diagnostico_particulas_8y.py'
      - 'tests/test_diagnostico_particulas_8y.py'
      - 'datos/aire_8x/estado_aire_8x.json'
      - 'datos/aire_8x/particulas_mensuales_8x.csv'
      - 'datos/integracion_8v/matriz_terrestre_8v.csv'
      - '.github/workflows/oaf_diagnostico_particulas_8y.yml'
permissions:
  contents: write
concurrency:
  group: oaf-diagnostico-pm-8y
  cancel-in-progress: false
jobs:
  examinar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: QA de correlacion, desestacionalizacion y ausencia de datos
        run: python -m unittest discover -s tests -p 'test_diagnostico_particulas_8y.py' -v
      - name: Integrar series reales solo en meses compatibles
        run: |
          python modelos/diagnostico_particulas_8y.py
          python modelos/diagnostico_particulas_8y.py --check
      - name: Auditoria de prohibiciones y completitud
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('datos/diagnostico_pm_8y/estado_diagnostico_pm_8y.json').read_text())
          assert d['fase']=='8Y'
          assert d['n_comparaciones']==40
          assert d['alertas_por_pm_o_fitosanidad_aprobadas'] is False
          assert d['inferencia_causal_permitida'] is False
          assert d['uso_pm_como_predictor_climatico_aprobado'] is False
          print('Disponibles:',d['n_comparaciones_evaluables'],'de',d['n_comparaciones'])
          PY
      - name: Publicar diagnostico con fuentes SHA
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos/diagnostico_pm_8y/estado_diagnostico_pm_8y.json
          if git diff --cached --quiet; then
            echo 'Sin cambios de métricas'
          else
            git commit -m 'data(oaf): diagnostico PM 8Y ajustado por estacionalidad'
            # This independent output can be recalculated if sources updated mid-run.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
