name: OAF UX75 - Reentrenamiento RF y validacion independiente
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modelos/experimento_rf_nuevos_datos_ux75.py"
      - ".github/workflows/oaf_rf_nuevos_datos_ux75.yml"
permissions:
  contents: write
concurrency:
  group: oaf-rf-experimento-ux75
  cancel-in-progress: false
jobs:
  evaluar_modelo_experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias para RF reproducible
        run: python -m pip install "numpy>=1.26,<3" "scikit-learn>=1.5,<2" requests joblib
      - name: Comprobar sintaxis y evitar modelos no auditables
        run: python -m py_compile modelos/experimento_rf_nuevos_datos_ux75.py
      - name: Ejecutar entrenamiento experimental con ERA5 actualizado
        run: python -u modelos/experimento_rf_nuevos_datos_ux75.py
      - name: Verificar tres referencias y proteger evaluacion temporal
        run: |
          python - <<'PY'
          import json,pathlib,hashlib
          path=pathlib.Path('datos/rf_experimento_ux75/evaluacion_reentrenamiento.json')
          j=json.loads(path.read_text())
          assert j['estado']=='evaluacion_completa'
          assert j['operativo_certificado'] is False and j['alertas_automaticas'] is False
          assert all(k in j['pruebas'] for k in ('2025','2026'))
          assert j['seleccion_2024']['candidatos']
          assert all(j['pruebas'][ano]['origenes']>=24 for ano in ('2025','2026'))
          assert all(len(j['pruebas'][ano]['metricas'][m][v]['mae_por_horizonte'])==7
              for ano in ('2025','2026')
              for m in ('direct','incumbente','climatologia')
              for v in ('rain','temp'))
          info=j['reentrenamiento_final']
          assert info['ejemplos_supervisados']>=6000
          assert info['publicado_como_operativo'] is False
          a=pathlib.Path('datos/rf_experimento_ux75/rf_candidato_multivariable_ux75.joblib')
          assert hashlib.sha256(a.read_bytes()).hexdigest()==info['sha256_modelo']
          print('CANDIDATO_ENTRENADO',info['ultimo_dato_incorporado'],info['ejemplos_supervisados'])
          print('COMPARACION_VALIDADA',json.dumps(j['comparacion_final']))
          PY
      - name: Guardar binario solo como artefacto de investigacion
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oaf-ux75-rf-candidato-no-operativo
          path: |
            datos/rf_experimento_ux75/evaluacion_reentrenamiento.json
            datos/rf_experimento_ux75/rf_candidato_multivariable_ux75.joblib
          if-no-files-found: ignore
          retention-days: 60
      - name: Publicar informe objetivo sin promocion automatica
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/rf_experimento_ux75/evaluacion_reentrenamiento.json
          if git diff --cached --quiet; then
            echo "No hay resultados nuevos."
            exit 0
          fi
          git commit -m "research(oaf): resultados reales de benchmark RF UX75"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
