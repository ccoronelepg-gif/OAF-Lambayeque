name: OAF 3Z CHIRPS v3 monitoreo reciente
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitoreo_chirps_reciente_3z.yml'
      - 'scripts/monitoreo_chirps_reciente_3z.py'
  schedule:
    - cron: '15 15 * * 1'
permissions:
  contents: write
concurrency:
  group: oaf-3z-chirps-mensual
  cancel-in-progress: false
jobs:
  monitoreo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar lector GeoTIFF
        run: python -m pip install --disable-pip-version-check requests numpy rasterio
      - name: Verificar GeoTIFF CHIRPS v3 y extraer cinco celdas
        id: extraer
        shell: bash
        run: |
          set +e
          python -u scripts/monitoreo_chirps_reciente_3z.py
          echo "salida=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Guardar solo resultados trazables y auditoria
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datos/chirps_v3_reciente_3z.csv datos/auditoria_rasters_chirps_3z.json datos/estado_monitoreo_3z.json MONITOREO_CHIRPS_RECIENTE_3Z.md
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar CHIRPS mensual reciente y auditoria 3Z"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Notificar si ninguna fuente fue accesible
        shell: bash
        run: |
          test "${{ steps.extraer.outputs.salida }}" = "0" || (echo "No hubo GeoTIFF mensual verificable; revisar estado_monitoreo_3z.json" && exit 1)
