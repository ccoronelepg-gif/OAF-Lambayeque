name: OAF - Fotos abiertas con respaldo local
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/descargar_fotos_cc_oaf_ux17.py
      - .github/workflows/oaf_fotos_cc_ux17.yml
permissions:
  contents: write
concurrency:
  group: oaf-fotos-abiertas
  cancel-in-progress: false
jobs:
  importar_fotografias_licenciadas:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias de validación fotográfica
        run: python -m pip install requests pillow
      - name: Descargar únicamente imágenes Commons de licencias documentadas
        run: python scripts/descargar_fotos_cc_oaf_ux17.py
      - name: Comprobar los archivos generados y la galería
        run: |
          python - <<'PY'
          import json, pathlib
          d=json.load(open("datos/galeria_sanidad_2026.json",encoding="utf-8"))
          assert len(d["organismos"])==23
          for x in d["organismos"].values():
              if x["url"].startswith("assets/fotos_cc/"):
                  assert pathlib.Path(x["url"]).is_file()
                  assert x.get("copia_local_licencia")
          print("Datos de origen y licencias verificados")
          PY
      - name: Publicar fotos reales con su licencia y créditos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/galeria_sanidad_2026.json assets/fotos_cc
          if git diff --cached --quiet; then echo "Sin fotos descargables nuevas";
          else
            git commit -m "assets(oaf): fotos Commons con licencia y copia local"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
