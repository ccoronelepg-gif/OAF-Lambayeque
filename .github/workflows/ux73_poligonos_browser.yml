name: OAF UX73 - Poligonos A y C navegador y ciencia
on:
  push:
    branches: [main]
    paths:
      - "assets/oaf-ux30-territorio-unificado.js"
      - "assets/oaf-ux73-peligros-poligonos.js"
      - "assets/oaf-ux35d-mapa-potencial.js"
      - "assets/oaf-ux74-reportes-pdf.js"
      - "assets/oaf-ux74-seguimiento-rf.js"
      - "assets/oaf-ux74.css"
      - "assets/oaf-ux15-rf-salidas.js"
      - "modelos/poligonos_potenciales_ux73.js"
      - "tests/ux73_navegador.cjs"
      - "tests/poligonos_ux73.cjs"
      - ".github/workflows/ux73_poligonos_browser.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  polygons:
    name: GIS, A cuatro capas, C y GeoJSON
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validar sintaxis de codigo nuevo
        run: |
          node --check modelos/poligonos_potenciales_ux73.js
          node --check assets/oaf-ux73-peligros-poligonos.js
          node --check assets/oaf-ux35d-mapa-potencial.js
          node --check assets/oaf-ux74-reportes-pdf.js
          node --check assets/oaf-ux74-seguimiento-rf.js
          node --check assets/oaf-ux15-rf-salidas.js
          node --check assets/oaf-ux30-territorio-unificado.js
      - name: Tests cientificos de poligonos y precipitacion
        run: node tests/poligonos_ux73.cjs
      - name: Instalar Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Servir sitio entero
        run: |
          python3 -m http.server 8765 > /tmp/ux73-http.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8765/index.html >/dev/null
      - name: Verificar cuatro capas A y superficies C en Chromium
        run: node tests/ux73_navegador.cjs
      - name: Validar documentos PDF con lector independiente
        run: |
          python3 -m pip install pypdf
          python3 - <<'PY'
          import pathlib
          from pypdf import PdfReader
          names=("a_puntos","a_poligonos","c_puntos","c_poligonos")
          for name in names:
              path=pathlib.Path("/tmp/oaf_ux74_"+name+".pdf")
              assert path.is_file() and path.stat().st_size>10000, name
              reader=PdfReader(path)
              assert len(reader.pages)>=2,(name,len(reader.pages))
              page=reader.pages[0].extract_text()
              assert "OAF" in page and "NO es un mapa oficial" in page, name
              print("PDF_UX74_VALIDO",name,"paginas",len(reader.pages),"bytes",path.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux73-capturas-poligonos
          path: |
            /tmp/oaf_ux73_peligros_a.png
            /tmp/oaf_ux73_fitosanitario_c.png
            /tmp/oaf_ux74_a_puntos.pdf
            /tmp/oaf_ux74_a_poligonos.pdf
            /tmp/oaf_ux74_c_puntos.pdf
            /tmp/oaf_ux74_c_poligonos.pdf
          if-no-files-found: ignore
          retention-days: 7
