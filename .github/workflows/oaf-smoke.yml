name: OAF - pruebas de regresión
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Integridad, mapas, predicciones y PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener proyecto
        uses: actions/checkout@v4
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ejecutar pruebas
        run: node --test tests/oaf-smoke.mjs
