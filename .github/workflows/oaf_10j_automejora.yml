name: OAF 10J — Automejora prudente Random Forest
on:
  push:
    paths:
      - "datos/nuevos_meses_chirps_10j/**"
      - "modelos/actualizacion_automatica_rf_10j.py"
      - "tests/test_automejora_rf_10j.py"
      - ".github/workflows/oaf_10j_automejora.yml"
  schedule:
    # La salida CHIRPS v3 Final suele producirse la tercera semana del mes siguiente.
    # La tarea no asume que ya exista el producto: solo lee filas completas depositadas.
    - cron: "17 13 26 * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oaf-10j-automejora-rf
  cancel-in-progress: false
jobs:
  verificar_y_entrenar_candidato:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fijar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 scikit-learn==1.9.1 shapely==2.2.0
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Validar archivos fuente nuevos y evitar uso de etiquetas futuras
        run: python -m unittest discover -s tests -p test_automejora_rf_10j.py -v
      - name: Identificar nuevas observaciones mensuales completas por sector
        run: python modelos/actualizacion_automatica_rf_10j.py --mode inspect
      - name: Entrenar SOLO candidato RF cuando existan nuevos meses comprobados
        run: python -u modelos/actualizacion_automatica_rf_10j.py --mode candidate
      - name: Inspeccionar bloqueo de despliegue, si hubo reentrenamiento
        run: |
          python - <<'PY'
          import json,pathlib
          path=pathlib.Path('datos/rf_robusto_10j/actualizacion_automatica_10j.json')
          if not path.exists():
            print('NO_NUEVOS_MESES: sin candidato; no se inventan observaciones.')
          else:
            j=json.load(open(path,encoding="utf8"))
            assert j['no_alertas_automaticas'] is True
            assert j['modelo_desplegado_automaticamente'] is False
            assert j['prediccion_de_infecciones'] is False
            assert j['familia_factores']=='solo_lluvia_CHIRPS_historica'
            assert j['n_meses']>=1
            print('CANDIDATO_SIN_PROMOCION',j['mes_ultimo'],j['sha256_modelo_joblib_interno'])
          PY
      - name: Guardar candidato interno y su evaluación como artefacto, NO como alerta pública
        uses: actions/upload-artifact@v4
        with:
          name: oaf-10j-candidato-automatico-no-operativo
          path: |
            datos/rf_robusto_10j/actualizacion_automatica_10j.json
            modelos/candidatos_temporales_10j/rf_lluvia_candidato.joblib
          if-no-files-found: ignore
          retention-days: 90
