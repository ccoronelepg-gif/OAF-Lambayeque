name: OAF 3Q consolidacion CHIRPS 1996-2015
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'datos/estado_3q_*.json'
      - 'scripts/consolidar_3q_1996_2015.py'
      - '.github/workflows/consolidar_3q.yml'
permissions:
  contents: write
concurrency:
  group: oaf-consolidar-chirps-3q
  cancel-in-progress: true
jobs:
  consolidar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Comprobar existencia de todos los bloques
        id: comprobar
        shell: bash
        run: |
          for b in 1996_2000 2001_2005 2006_2010 2011_2015; do
            if [ ! -f "datos/comparacion_3q_multianual_$b.csv" ]; then
              echo "disponibles=false" >> "$GITHUB_OUTPUT"
              echo "En espera del bloque $b"
              exit 0
            fi
          done
          echo "disponibles=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.comprobar.outputs.disponibles == 'true'
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        if: steps.comprobar.outputs.disponibles == 'true'
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Validar identidad de meses y consolidar resultados
        if: steps.comprobar.outputs.disponibles == 'true'
        run: python -u scripts/consolidar_3q_1996_2015.py
      - name: Versionar informe y métricas finales
        if: steps.comprobar.outputs.disponibles == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f VALIDACION_3Q_1996_2015.md datos/estado_3q_1996_2015.json datos/comparacion_3q_1996_2015.csv datos/metricas_3q_1996_2015.csv
          if ! git diff --cached --quiet; then
            git commit -m "Consolidar CHIRPS PISCOp y ERA5 para toda cobertura SENAMHI 1996-2015"
            git pull --rebase origin main
            git push origin main
          fi
