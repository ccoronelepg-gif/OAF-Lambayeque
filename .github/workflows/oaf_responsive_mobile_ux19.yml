name: OAF - Verificar web en celulares
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ecorregiones-clima-10k.html"
      - "assets/oaf-responsive-celulares-ux19.css"
      - "assets/oaf-responsive-celulares-ux19.js"
      - "tests/test_movil_ux19.js"
      - "assets/oaf-ux21-editorial.js"
      - "assets/oaf-ux21-lectura-limpia.css"
      - "tests/test_ux21_limpieza.cjs"
      - "tests/test_ux21_browser.cjs"
      - "tests/test_movil_ux19_browser.cjs"
      - "manifest.webmanifest"
      - "sw.js"
      - "offline.html"
      - "assets/oaf-pwa.css"
      - "assets/oaf-pwa.js"
      - "assets/oaf-app-icon*"
      - "assets/oaf-app-maskable*"
      - "tests/test_pwa_ux20.cjs"
      - "tests/test_pwa_ux20_browser.cjs"
      - "assets/oaf-ux22-editorial-justificada.css"
      - "tests/test_editorial_ux22_browser.cjs"
      - ".github/workflows/oaf_responsive_mobile_ux19.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navegacion_y_pantallas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar navegador de pruebas
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Servir proyecto GitHub Pages sin requerir Internet externo
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/oaf-ux19-server.log 2>&1 &
          echo $! > /tmp/oaf-ux19-server.pid
          sleep 2
      - name: Comprobar pantallas y navegación táctil
        run: |
          node tests/test_movil_ux19.js
          node tests/test_movil_ux19_browser.cjs
      - name: Verificar manifiesto PWA, iconos e instalación en Chromium
        if: always()
        run: |
          node tests/test_pwa_ux20.cjs
          node tests/test_pwa_ux20_browser.cjs
          node tests/test_editorial_ux22_browser.cjs
      - name: Confirmar simplificación editorial en versión web y aplicación
        run: |
          node tests/test_ux21_limpieza.cjs
          node tests/test_ux21_browser.cjs
      - name: Conservar capturas para revisión visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oaf-mobile-ux19-screenshots
          path: artifacts/mobile-ux19/
          if-no-files-found: ignore
          retention-days: 14
