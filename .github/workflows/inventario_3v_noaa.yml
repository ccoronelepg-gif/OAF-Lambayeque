name: OAF fase 3V inventario NOAA de estaciones candidatas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventario_3v_noaa.yml'
      - 'scripts/inventario_3v_noaa.py'
permissions:
  contents: write
concurrency:
  group: oaf-3v-noaa
  cancel-in-progress: false
jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar biblioteca de descarga
        run: python -m pip install --disable-pip-version-check requests
      - name: Consultar inventarios oficiales y archivos diarios
        id: analizar
        shell: bash
        run: |
          set +e
          python -u scripts/inventario_3v_noaa.py
          echo "salida=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Guardar únicamente metadatos y estado verificable
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f INVENTARIO_3V_NOAA.md datos/candidatos_3v_noaa.csv datos/estado_3v_noaa.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar evaluación real de cobertura NOAA fase 3V"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Verificar resultado
        run: test "${{ steps.analizar.outputs.salida }}" = "0"
