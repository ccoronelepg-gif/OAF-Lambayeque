name: OAF 10O - RF experimental diario y mensual
on:
  schedule:
    - cron: "41 15 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modelos/pronostico_rf_experimental_ux15.py"
      - ".github/workflows/oaf_rf_experimental_ux15.yml"
permissions:
  contents: write
concurrency:
  group: oaf-rf-experimental-ux15
  cancel-in-progress: false
jobs:
  entrenamiento_y_publicacion_experimental:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar herramientas NumPy, scikit-learn y solicitudes HTTPS
        run: python -m pip install numpy scikit-learn requests
      - name: Verificación estática de la implementación en Python
        run: python -m py_compile modelos/pronostico_rf_experimental_ux15.py
      - name: Entrenar RF y comprobar pronósticos solo como candidatos
        run: python modelos/pronostico_rf_experimental_ux15.py
      - name: Verificar procedencia y que nunca se activen alertas
        run: |
          python - <<'PY'
          import json
          j=json.load(open('datos/rf_experimental_ux15.json',encoding='utf8'))
          assert j['alertas_automaticas'] is False
          assert j['operativo_certificado'] is False
          if j['estado']=='candidato_experimental_generado':
              from datetime import date, timedelta
              assert set(j['pronostico_diario_rf_experimental'])=={'Chiclayo','Jayanca','Motupe','Olmos'}
              assert set(j['escenarios_mensuales_rf_experimentales'])=={'Chiclayo','Jayanca','Motupe','Olmos'}
              for city,rows in j['pronostico_diario_rf_experimental'].items():
                  dates=[date.fromisoformat(x['fecha']) for x in rows]
                  assert len(dates)==7 and all(b-a==timedelta(days=1) for a,b in zip(dates,dates[1:]))
                  assert all(x['precipitacion_mm']>=0 and -5<=x['temperatura_max_c']<=55 for x in rows)
              metric=j['metrica_mensual']
              assert 0.2<=metric['peso_rf_ajustado']<=1.0
              assert metric['mae_climatologia_local_mm']>=0
              assert metric['seleccion_solo_validacion'].startswith('2019-2020')
              assert 'as-issued' not in metric.get('seleccion_solo_validacion','')
              back=j["metrica_diaria"].get("backtest_semanal_recursivo")
              assert back and back["n_origenes"]>=40
              assert [q["dias_adelante"] for q in back["por_horizonte"]]==list(range(1,8))
              assert all(q["n"]>=40 and q["mae_rf_lluvia_mm"]>=0 for q in back["por_horizonte"])
              assert j["control_nuevos_datos"]["series_pronosticos_emitidos_son_etiquetas_entrenamiento"] is False
              assert j["entrenamiento_actualizado_con_era5_hasta"]<=j["control_nuevos_datos"]["limite_adquisicion_era5"]
              assert j['horizonte_semanal']==7
              assert all(len(v)==7 for v in j['pronostico_diario_rf_experimental'].values())
              assert all(len(v)==6 and v[0]['mes']>='2026-11' for v in j['escenarios_mensuales_rf_experimentales'].values())
          else:
              assert j['estado']=='no_disponible'
          print("ESTADO_CANDIDATO_RF:",j['estado'])
          PY
      - name: Publicar resultado experimental fechado sin promover modelo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/rf_experimental_ux15.json
          if git diff --cached --quiet; then
            echo "Sin cambios en informe RF."
          else
            git commit -m "data(oaf): nuevo candidato RF experimental con estado y validacion"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main || { echo "Conflicto de rebase: revisión necesaria"; exit 1; }
              if git push origin HEAD:main; then
                echo "Modelo candidato publicado: intento $attempt"
                exit 0
              fi
              echo "Main avanzó durante publicación RF, reintento $attempt/5"
              sleep $((attempt * 2))
            done
            echo "Publicación pendiente: main siguió cambiando."
            exit 1
          fi
