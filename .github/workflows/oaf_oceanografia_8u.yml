name: OAF 8U - TSM NOAA y corrientes marinas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modelos/oceanografia_fuentes_8u.py'
      - 'modelos/corrientes_geostroficas_8u.py'
      - 'tests/test_oceanografia_8u.py'
      - '.github/workflows/oaf_oceanografia_8u.yml'
      - 'modelos/visor_forzantes_8u.js'
      - 'FASE_8U_VIENTO_TSM_CORRIENTES.md'
      - 'index.html'
  schedule:
    - cron: '43 19 * * *'
permissions:
  contents: write
concurrency:
  group: oaf-8u-oceanography
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sincronizar datos NOAA originales
        run: git pull --ff-only origin main
      - name: Verificar diferenciación de TSM, viento y corrientes marinas
        run: python -m unittest discover -s tests -p 'test_oceanografia_8u.py' -v
      - name: Publicar TSM Niño1+2 y catálogo de corrientes comprobable
        run: |
          python modelos/oceanografia_fuentes_8u.py
          python modelos/oceanografia_fuentes_8u.py --check
      - name: Recuperar hasta dos subconjuntos geostróficos NOAA/AOML
        run: python modelos/corrientes_geostroficas_8u.py --fetch --max-new 2
      - name: Auditar cobertura de corrientes geostróficas sin imputar faltantes
        run: |
          python modelos/corrientes_geostroficas_8u.py
          python modelos/corrientes_geostroficas_8u.py --check
      - name: Comprobar nuevo complemento del visor 8U
        run: |
          node --check modelos/visor_forzantes_8u.js
          python - <<'PY'
          from pathlib import Path
          text=Path("index.html").read_text(encoding="utf-8")
          for name in ("oaf-8u-extra-wind","oaf-8u-extra-sst","oaf-8u-extra-currents",
                       "oaf-8u-extra-refresh","oaf-8u-extra-status",
                       "oaf-8u-extra-wind-table","oaf-8u-extra-ocean-table",
                       "oaf-8u-extra-current-table"):
              assert text.count('id="'+name+'"')==1,name
          assert 'src="modelos/visor_forzantes_8u.js"' in text
          assert 'FASE_8U_VIENTO_TSM_CORRIENTES.md' in text
          print("Complemento 8U: idempotente y montado")
          PY
      - name: Guardar NOAA fuente original, resultados y su estado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/oceanografia_8u/ datos/corrientes_8u/
          if git diff --cached --quiet; then
            echo "NOAA originales y resultados ya coinciden."
          else
            git commit -m "data(oaf): TSM NOAA y corrientes geostróficas trazables, sin imputaciones"
            git pull --rebase origin main
            git push
          fi
