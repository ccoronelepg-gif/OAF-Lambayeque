name: OAF fase 3Q piloto CHIRPS mensual 1998
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validacion_3q_chirps.yml'
      - 'scripts/validacion_3q_chirps_1998.py'
permissions:
  contents: write
concurrency:
  group: oaf-chirps-3q
  cancel-in-progress: false
jobs:
  descargar-y-comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias CHIRPS y GIS
        run: python -m pip install --disable-pip-version-check pandas numpy requests rasterio
      - name: Extraer 12 rasters mensuales CHIRPS v3 y comparar estaciones
        id: analizar
        shell: bash
        run: |
          set +e
          python -u scripts/validacion_3q_chirps_1998.py
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Guardar resultados y incidencias verificadas
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f CHIRPS_3Q_1998.md datos/chirps_3q_pixeles_1998.csv datos/comparacion_3q_chirps_1998.csv datos/metricas_3q_chirps_1998.csv datos/estado_3q_chirps.json
          if ! git diff --cached --quiet; then
            git commit -m "Registrar datos y métricas CHIRPS v3 fase 3Q"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Verificar que existan datos utilizables
        shell: bash
        run: |
          test "${{ steps.analizar.outputs.codigo }}" = "0" || (echo "Sin datos validos CHIRPS; revisar registros" && exit 1)
