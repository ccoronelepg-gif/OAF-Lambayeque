name: OAF 10K — Random Forest por paisajes ecoclimáticos
on:
  push:
    paths:
      - "modelos/rf_ecopaisajes_10k.py"
      - "tests/test_rf_ecopaisajes_10k.py"
      - ".github/workflows/oaf_10k_rf_ecopaisajes.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oaf-10k-eco-experimental
  cancel-in-progress: false
jobs:
  training_and_geospatial_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias científicas fijadas
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 scikit-learn==1.9.1 shapely==2.2.0
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Ocho pruebas de polígonos experimentales, pisos y no fuga temporal
        run: python -m unittest discover -s tests -p test_rf_ecopaisajes_10k.py -v
      - name: Entrenar RF geográfico y evaluar cinco bloques y cinco paisajes
        run: python -u modelos/rf_ecopaisajes_10k.py
      - name: Auditar mapa, 4680 predicciones y resumen por paisaje
        run: |
          python modelos/rf_ecopaisajes_10k.py --check
          python - <<'PY'
          import json
          d=json.load(open('datos/ecopaisajes_10k/evaluacion_ecoclimatica_10k.json',encoding='utf8'))
          g=json.load(open('datos/ecopaisajes_10k/paisajes_ecoclimaticos_10k.geojson',encoding='utf8'))
          s=json.load(open('datos/ecopaisajes_10k/series_sector_mes_10k.json',encoding='utf8'))
          assert d['n_paisajes']==5 and d['n_sectores']==39 and d['n_predicciones']==4680
          assert d['ecorregiones_oficiales_intersectadas'] is False
          assert len(g['features'])==39 and len(s['datos'])==2340
          assert d['controles_operativos']['pronostico_en_tiempo_real_habilitado'] is False
          assert d['controles_operativos']['prediccion_de_enfermedades'] is False
          print('10K_GLOBAL',d['resultado_selector_mm']['global'])
          for key,val in d['resultado_selector_mm']['por_paisaje'].items():
            print('10K_ECOPAISAJE',key,val)
          print('10K_SELECCION',d['seleccion_por_validacion'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oaf-10k-eco-map-climate-evaluation
          path: |
            datos/ecopaisajes_10k/evaluacion_ecoclimatica_10k.json
            datos/ecopaisajes_10k/paisajes_ecoclimaticos_10k.geojson
            datos/ecopaisajes_10k/series_sector_mes_10k.json
            datos/ecopaisajes_10k/predicciones_ecopaisajes_10k.csv
          retention-days: 90
      - name: Publicar solo matrices de prueba retrospectivas auditadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/ecopaisajes_10k
          git diff --cached --quiet || git commit -m "data(10K): pronosticos historicos RF por cinco paisajes con control MINAM"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
