name: OAF 8H - Auditoría instrumental e incertidumbre
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modelos/auditoria_instrumental_8h.py'
      - 'tests/test_auditoria_instrumental_8h.py'
      - 'datos/catalogo_instrumental_candidato_8h.csv'
      - 'datos/senamhi_mensual_completo_1996_2015.csv'
      - 'datos/estado_cobertura_oficial.json'
      - 'datos/evaluacion_prospectiva_8g/metricas_8g.json'
      - '.github/workflows/oaf_auditoria_8h.yml'
  schedule:
    - cron: '42 18 15 * *'
permissions:
  contents: write
concurrency:
  group: oaf-instrumental-8h
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar casos reales de procedencia y pruebas sintéticas sin fuga temporal
        run: python -m unittest discover -s tests -p 'test_auditoria_instrumental_8h.py' -v
      - name: Comprobar visor 8H sin redundancia ni errores de sintaxis
        run: |
          node --check modelos/visor_auditoria_instrumental_8h.js
          python - <<'PY'
          from pathlib import Path
          index=Path("index.html").read_text(encoding="utf-8")
          for ident in ("oaf-audit-8h","oaf-8h-refresh","oaf-8h-status","oaf-8h-cobertura","oaf-8h-estaciones","oaf-8h-month-n","oaf-8h-temperature-n"):
              assert index.count('id="'+ident+'"')==1, "Identificador inexistente/duplicado "+ident
          assert 'src="modelos/visor_auditoria_instrumental_8h.js"' in index
          assert 'FASE_8H_AUDITORIA_INSTRUMENTAL.md' in index
          assert 'data-page="verificaciones"' in index
          assert 'meses-estación completos</small><b>1 109' not in index, "Ficha redundante antigua"
          print("Visor 8H: sintaxis, IDs y rediseño correctos")
          PY
      - name: Auditar evidencia instrumental sin convertir lluvia a temperatura
        run: |
          python modelos/auditoria_instrumental_8h.py
          python modelos/auditoria_instrumental_8h.py --check
      - name: Publicar sólo reportes derivados, conservar fuentes originales
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/auditoria_instrumental_8h/
          if git diff --cached --quiet; then
            echo "Sin cambios en controles instrumentales."
          else
            git commit -m "data(oaf): actualizar auditoría instrumental 8H sin afirmar validación térmica"
            git pull --rebase origin main
            git push
          fi
