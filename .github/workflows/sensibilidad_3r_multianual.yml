name: OAF fase 3R sensibilidad geografica 1996-2015
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sensibilidad_3r_multianual.yml'
      - 'scripts/sensibilidad_3r_multianual.py'
permissions:
  contents: write
concurrency:
  group: oaf-3r-sensibilidad-historica
  cancel-in-progress: false
jobs:
  tramos:
    name: Sensibilidad CHIRPS
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - inicio: 1996
            fin: 2000
          - inicio: 2001
            fin: 2005
          - inicio: 2006
            fin: 2010
          - inicio: 2011
            fin: 2015
    env:
      OAF_YEAR_START: ${{ matrix.inicio }}
      OAF_YEAR_END: ${{ matrix.fin }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar bibliotecas raster
        run: python -m pip install --disable-pip-version-check pandas numpy requests rasterio
      - name: Extraer y cotejar precipitación mensual
        id: analisis
        shell: bash
        run: |
          set +e
          python -u scripts/sensibilidad_3r_multianual.py
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Conservar informe, datos y estado real
        shell: bash
        run: |
          suf="$OAF_YEAR_START"_"$OAF_YEAR_END"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "datos/pixeles_3r_$suf.csv" "datos/sensibilidad_3r_mensual_$suf.csv" "datos/sensibilidad_3r_metricas_$suf.csv" "datos/estado_3r_$suf.json" "SENSIBILIDAD_3R_$suf.md"
          if ! git diff --cached --quiet; then
            git commit -m "Guardar resultados sensibilidad 3R $OAF_YEAR_START-$OAF_YEAR_END"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Verificar integridad del bloque
        shell: bash
        run: |
          test "${{ steps.analisis.outputs.codigo }}" = "0" || (echo "Analisis de bloque incompleto; consultar logs y estado" && exit 1)
