name: OAF 6E - External climate variables API check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oaf_variables_6e_check.yml'
      - 'tests/test_variables_agroclimaticas_6e.py'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check forecast and historical solar, VPD, wind, humidity, ET0
        run: python tests/test_variables_agroclimaticas_6e.py
