name: OAF 6F - Dated Prospective Climate Forecast Archive
on:
  workflow_dispatch:
  schedule:
    - cron: '27 13 * * *'
  push:
    branches: [main]
    paths:
      - 'modelos/archivar_pronosticos_prospectivos_6f.py'
      - '.github/workflows/oaf_archivo_prospectivo_6f.yml'
permissions:
  contents: write
concurrency:
  group: oaf-daily-forecast-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dated forecasts and rejection of missing radiation
        run: python modelos/archivar_pronosticos_prospectivos_6f.py --self-test
      - name: Snapshot daily future forecasts for four localities
        run: python modelos/archivar_pronosticos_prospectivos_6f.py
      - name: Commit verified pre-event snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/pronosticos_emitidos/
          if git diff --cached --quiet; then
            echo "Forecast snapshot already archived for local date."
          else
            git commit -m "data(oaf): archive dated external forecast for independent prospective verification"
            git pull --rebase origin main
            git push
          fi
