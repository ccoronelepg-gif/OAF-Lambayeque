name: OAF 3W geografia nacional GBON RBON
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inventario_gbon_3w.yml'
      - 'scripts/inventario_nacional_gbon_3w.py'
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar biblioteca de lectura
        run: python -m pip install --disable-pip-version-check requests
      - name: Contrastar red nacional y cercanía a Lambayeque
        run: python -u scripts/inventario_nacional_gbon_3w.py
      - name: Guardar inventario geográfico y metadatos nacionales
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f datos/inventario_nacional_gbon_3w.csv datos/estado_geografia_3w.json
          if ! git diff --cached --quiet; then
            git commit -m "Validar geografía real del CSV SENAMHI GBON/RBON fase 3W"
            git pull --rebase origin main
            git push origin main
          fi
