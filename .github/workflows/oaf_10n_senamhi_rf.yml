name: OAF 10N — Entrenamiento SENAMHI experimental de montaña
on:
  push:
    paths:
      - "datos/senamhi_10n/meses_pluviometricos_completos_10n.csv"
      - "modelos/entrenar_rf_estaciones_senamhi_10n.py"
      - ".github/workflows/oaf_10n_senamhi_rf.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oaf-10n-estaciones
  cancel-in-progress: false
jobs:
  entrenar_y_controlar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias del Random Forest
        run: python -m pip install numpy==2.4.6 scikit-learn==1.9.1 joblib
      - name: Entrenamiento por estaciones — meses 2021-2024 y calibración 2025
        run: python -u modelos/entrenar_rf_estaciones_senamhi_10n.py
      - name: Validar integridad, 2026 fuera de entrenamiento y estado no operativo
        run: |
          python modelos/entrenar_rf_estaciones_senamhi_10n.py --check
          python - <<'PY'
          import csv,json
          p='datos/senamhi_10n/evaluacion_rf_estacion_10n.json'
          d=json.load(open(p,encoding='utf8'))
          assert d['entrenamiento_2021_2024']==17 and d['ajuste_2025']==15 and d['prueba_2026']==8
          assert not d['reentrenamiento_regional'] and not d['pronosticos_actuales_habilitados']
          assert d['QC_instrumental_formal_aprobado'] is False
          assert d['prediccion_enfermedades'] is False
          with open('datos/senamhi_10n/evaluacion_mensual_rf_estacion_10n.csv',newline='',encoding='utf8') as f:
            rows=list(csv.DictReader(f))
          assert len(rows)==23
          assert all(int(r['mes'][:4])>=2025 for r in rows)
          print('10N_2026_NO_USADO_EN_TRAIN',d['resultado_2026'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oaf-10n-estaciones-rf-candidato-no-operativo
          path: |
            modelos/candidatos_10n/rf_estaciones_cumbre_10n.joblib
            datos/senamhi_10n/evaluacion_rf_estacion_10n.json
            datos/senamhi_10n/evaluacion_mensual_rf_estacion_10n.csv
          retention-days: 90
      - name: Archivar evaluación de investigación sin publicar modelo operativo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/senamhi_10n/evaluacion_rf_estacion_10n.json datos/senamhi_10n/evaluacion_mensual_rf_estacion_10n.csv
          git diff --cached --quiet || git commit -m "data(10N): corregir pluviometria RF por estaciones con referencia CHIRPS, sin mejoras validadas"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
