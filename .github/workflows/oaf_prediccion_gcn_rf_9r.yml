name: OAF 9R - GCN contra Random Forest en predicción CHIRPS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modelos/comparacion_gcn_rf_9r.py'
      - 'tests/test_comparacion_gcn_rf_9r.py'
      - 'modelos/visor_comparacion_9r.js'
      - 'index.html'
      - 'FASE_9R_COMPARACION_GCN_RANDOM_FOREST.md'
      - '.github/workflows/oaf_prediccion_gcn_rf_9r.yml'
permissions:
  contents: write
concurrency:
  group: oaf-validacion-9r
  cancel-in-progress: false
jobs:
  comparar-modelos:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias para Random Forest, GCN y geometría
        run: |
          python -m pip install --upgrade pip
          pip install numpy==1.26.4 scikit-learn==1.6.1 shapely==2.1.2
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Entrenar y comparar con entrenamiento y pruebas temporales aislados
        run: |
          python modelos/comparacion_gcn_rf_9r.py
          python modelos/comparacion_gcn_rf_9r.py --check
      - name: Revisar métricas de error y no declarar skill operativo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('datos/validacion_predictiva_9r')
          r=json.loads((root/'comparacion_modelos_9r.json').read_text('utf8'))
          assert r['origen_CHIRPS']['meses_verificados']==360
          assert r['conjuntos']['n_meses_prueba']==60
          assert r['n_modelos_operativamente_validados']==0
          assert not r['alertas_fitosanitarias_emitidas']
          assert not r['pronostico_2026_comprobado']
          assert r['n_predicciones_sector_mes_prueba']==60*r['grafo']['n_nodos_con_lluvia_valida']
          for model,metric in r['metricas_prueba'].items():
            assert 0<=metric['mae_mm']<100000
            assert 0<=metric['rmse_mm']<100000
          print('9R MAE prueba mm por sector-mes:')
          for k,v in r['metricas_prueba'].items():
            print(k,':',v['mae_mm'],'RMSE',v['rmse_mm'],'Skill',v['skill_mae_vs_climatologia_pct'])
          print('Ganador ML:',r['mejor_modelo_ml_por_mae'])
          PY
      - name: Pruebas de leakage, pisos, integridad y UX
        run: |
          python -m unittest discover -s tests -p 'test_comparacion_gcn_rf_9r.py' -v
          python -m unittest discover -s tests -p 'test_ux_oaf_2026.py' -v
          node --check modelos/visor_comparacion_9r.js
      - name: Guardar evidencia numérica verificable
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --mixed origin/main
          git add datos/validacion_predictiva_9r/
          if git diff --cached --quiet; then
            echo '9R sin variaciones'
          else
            git commit -m 'data(9R): evidencia GCN vs RF, baseline y prueba ciega 2021-2025'
            git push origin HEAD:main
          fi
