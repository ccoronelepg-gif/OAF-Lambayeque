name: OAF - Mapa de elevaciones Chiclayo (DEM exploratorio)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oaf_dem_chiclayo.yml'
      - 'modelos/mapa_elevacion_chiclayo.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mapa-copernicus:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Librerias del mapa
        run: pip install rasterio==1.4.3 numpy==2.2.6 matplotlib==3.10.3 scipy==1.15.3
      - name: Generar mapa con el TIFF original y control SHA
        run: python modelos/mapa_elevacion_chiclayo.py
      - name: Publicar resultados cartográficos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add datos/dem_chiclayo_las_brisas/
          if git diff --cached --quiet; then
            echo 'Sin cambios'
          else
            git commit -m 'data(OAF): derivación DEM exploratoria de Las Brisas'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
