name: OAF 10J — Exportar modelo RF candidato verificable
on:
  push:
    paths:
      - "modelos/exportar_candidato_rf_10j.py"
      - "modelos/inferencia_rf_lluvia_10j.py"
      - ".github/workflows/oaf_10j_exportacion_modelo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exportar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias reproducibles
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 scikit-learn==1.9.1 shapely==2.2.0
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Exportar RF de lluvia mm/P90/P95 ajustado con toda la historia disponible
        run: python -u modelos/exportar_candidato_rf_10j.py
      - name: Verificar integridad del modelo propio y ausencia de alertas
        run: python modelos/exportar_candidato_rf_10j.py --check
      - name: Asegurar inferencia reproducible y bloqueo ante rezagos faltantes
        run: |
          python - <<'PY'
          import sys,itertools,joblib
          sys.path.insert(0,'modelos')
          import inferencia_rf_lluvia_10j as infer
          import probabilidad_39_sectores_10f as base
          import actualizacion_automatica_rf_10j as new
          from exportar_candidato_rf_10j import MODEL
          model=joblib.load(MODEL) # file generated by this workflow, trusted.
          nodes,A,edges,fixed,floors,geometries,data,audit=base.previous.inputs()
          hist={month:{sid:data[sid][month] for sid in nodes} for month in
                itertools.islice(new.months_between(1996,1),360)}
          forecast=infer.research_inference(model,hist,'2026-02')
          assert len(forecast)==39
          assert all(not r['es_alerta_meteorologica'] and r['prediccion_enfermedad'] is None for r in forecast)
          try:infer.research_inference(model,hist,'2026-10')
          except ValueError:print('10J_NO_FORECAST_SIN_DATOS_AGOSTO_2026')
          else:raise AssertionError('Modelo uso variables ausentes')
          print('10J_INFERENCIA_RF_VALIDADA_SIN_ALERTAS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: oaf-10j-modelo-rf-experimental-con-sha
          path: |
            modelos/candidatos_10j/rf_precipitacion_candidato_10j.joblib
            datos/rf_robusto_10j/manifest_modelo_candidato_10j.json
          retention-days: 90
      - name: Publicar solamente hash y metadatos, no modelo en producción
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/rf_robusto_10j/manifest_modelo_candidato_10j.json
          git diff --cached --quiet || git commit -m "data(10J): manifiesto RF candidato con SHA y bloqueo operativo"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
