name: OAF 10D · Comparación controlada de rezagos y lluvias intensas
on:
  push:
    paths:
      - "modelos/experimento_factorial_10d.py"
      - "tests/test_factorial_10d.py"
      - "datos/experimentos_10d/roni_noaa_2021_2025.json"
      - ".github/workflows/oaf_10d_factorial.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  experimento:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalación de versiones congeladas
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.4.6 scikit-learn==1.9.1 shapely==2.2.0
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Revisar fuga temporal, umbrales y RONI
        run: python -m unittest discover -s tests -p test_factorial_10d.py -v
      - name: Reentrenar ambos diseños con idéntica partición temporal
        run: python modelos/experimento_factorial_10d.py
      - name: Auditar integridad de predicciones y protección de alertas
        run: python modelos/experimento_factorial_10d.py --check
      - name: Comprobar cobertura y resúmenes auditables
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("datos/experimentos_10d/evaluacion_controlada_10d.json")
          d=json.loads(p.read_text("utf8"))
          assert d["n_predicciones_calibracion"]==5616
          assert d["n_predicciones_prueba"]==14040
          assert len(d["mae_global"])==6
          assert len(d["eventos"])==18
          assert d["modelo_operativo_ganador"] is None
          assert d["as_issued_certificado"] is False
          assert d["alertas_habilitadas"] is False
          for r in d["mae_global"]:
            print("METRICA_10D",r)
          for model,v in d["bootstrap_pareado_cinco_bloques"].items():
            print("INTERVALO_10D",model,v)
          for r in d["eventos"]:
            if r["umbral_evento_mm"]==100: print("UMBRAL100_10D",r)
          PY
      - name: Subir artefactos auditados
        uses: actions/upload-artifact@v4
        with:
          name: oaf-10d-control-factorial
          path: |
            datos/experimentos_10d/evaluacion_controlada_10d.json
            datos/experimentos_10d/predicciones_factorial_10d.csv
          retention-days: 90
      - name: Incorporar resultados numéricos al repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/experimentos_10d/evaluacion_controlada_10d.json datos/experimentos_10d/predicciones_factorial_10d.csv
          git diff --cached --quiet || git commit -m "data(10D): contraste factorial de rezagos y riesgos de lluvia"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
