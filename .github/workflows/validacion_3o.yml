name: OAF validacion multianual 3O
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/validacion_3o_multianual.py'
      - 'datos/senamhi_mensual_completo_1996_2015.csv'
      - '.github/workflows/validacion_3o.yml'
permissions:
  contents: write
concurrency:
  group: validacion-3o
  cancel-in-progress: false
jobs:
  contraste:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias cientificas
        run: python -m pip install --disable-pip-version-check pandas numpy requests scipy
      - name: Consultar productos historicos y analizar series
        id: analizar
        shell: bash
        run: |
          set +e
          python -u scripts/validacion_3o_multianual.py
          codigo=$?
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Versionar las salidas reales, incluso si hubo errores de consulta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f VALIDACION_3O.md datos/comparacion_3o_multianual.csv datos/metricas_3o_multianual.csv datos/estado_3o.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Registrar analisis multianual 3O (consultas reales)"
            git push
          fi
      - name: Comprobar resultado
        shell: bash
        run: |
          test "${{ steps.analizar.outputs.codigo }}" = "0" || (echo "ERROR: Sin pares meteorologicos. Consultar estado_3o.json" && exit 1)
