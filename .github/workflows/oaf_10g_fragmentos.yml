name: OAF 10G — Ingesta fragmentada respetuosa de cuotas
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "segment (exactamente una solicitud al proveedor) o assemble (sin API)"
        type: choice
        required: true
        options:
          - segment
          - assemble
      period:
        description: "Ventana: 0=1996-2005, 1=2006-2015, 2=2016-2025"
        type: choice
        required: false
        options:
          - "0"
          - "1"
          - "2"
      batch:
        description: "Grupo de 0 a 7; un máximo de cinco puntos"
        type: choice
        required: false
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
          - "7"
permissions:
  contents: write
concurrency:
  group: oaf-era5-historico-10g-limite-api
  cancel-in-progress: false
jobs:
  segmento_o_ensamblado:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar geometría auditable
        run: python -m pip install shapely==2.1.2
      - name: Ejecutar tests y puntos interiores
        run: python -m unittest discover -s tests -p test_ingesta_era5_10g.py -v
      - name: Extraer UN lote y conservarlo con SHA o ensamblar solo datos existentes
        env:
          MODE: ${{ inputs.mode }}
          PERIOD: ${{ inputs.period }}
          BATCH: ${{ inputs.batch }}
        run: |
          if [ "$MODE" = "segment" ]; then
            python modelos/ingesta_fragmentada_10g.py --mode segment --period "${PERIOD}" --batch "${BATCH}"
          else
            python modelos/ingesta_fragmentada_10g.py --mode assemble
            python modelos/ingesta_era5_39_sectores_10g.py --mode verify
          fi
      - name: Guardar fragmentos u outputs completos como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: oaf-era5-10g-${{ inputs.mode }}-${{ inputs.period }}-${{ inputs.batch }}
          path: |
            datos/atmosfera_sectorial_10g/fragmentos/
            datos/atmosfera_sectorial_10g/muestra_era5_mensual_10g.csv
            datos/atmosfera_sectorial_10g/auditoria_atmosfera_10g.json
          retention-days: 90
          if-no-files-found: warn
      - name: Confirmar únicamente resultados verificados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/atmosfera_sectorial_10g/fragmentos datos/atmosfera_sectorial_10g/muestra_era5_mensual_10g.csv datos/atmosfera_sectorial_10g/auditoria_atmosfera_10g.json datos/atmosfera_sectorial_10g/puntos_y_advertencias_10g.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data(10G): fragmento ERA5 o historico completo con QA"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
