<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" role="img" aria-labelledby="title desc">
<title id="title">Monitoreo agroclimático y fitosanitario de Lambayeque</title><desc id="desc">Ilustración editorial de campos agrícolas, cordillera, nubes, una estación meteorológica, mapa territorial y gráficos de datos conectados. No muestra mediciones reales.</desc>
<defs>
